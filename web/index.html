<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Coparentes - secure co-parenting workspace for Poland.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coparentes">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <title>Coparentes</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      window.__coparentesStartApp = async function () {
        try {
          var response = await fetch('/version.json', { cache: 'no-store' });
          if (!response.ok) {
            return true;
          }
          var payload = await response.json();
          var buildId = payload && payload.buildId;
          if (!buildId) {
            return true;
          }

          var storageKey = 'coparentes_build_id';
          var previousBuildId = localStorage.getItem(storageKey);
          localStorage.setItem(storageKey, buildId);

          if (previousBuildId && previousBuildId !== buildId) {
            if ('serviceWorker' in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(
                registrations.map(function (registration) {
                  return registration.unregister();
                }),
              );
            }
            if ('caches' in window) {
              var cacheKeys = await caches.keys();
              await Promise.all(
                cacheKeys.map(function (cacheKey) {
                  return caches.delete(cacheKey);
                }),
              );
            }
            location.reload();
            return false;
          }
        } catch (error) {
          // Ignore update checks offline or when version.json is unavailable.
        }
        return true;
      };
    })();
  </script>
</head>
<body>
  <script>
    window.__coparentesStartApp().then(function (shouldBoot) {
      if (!shouldBoot) {
        return;
      }
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
