[build]
  command = "bash scripts/netlify-build.sh"
  publish = "build/web"

[build.environment]
  CI = "true"
  NODE_VERSION = "22"

[[redirects]]
  from = "https://aquamarine-florentine-7c7edc.netlify.app/*"
  to = "https://getcoparentes.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.getcoparentes.app/*"
  to = "https://getcoparentes.app/:splat"
  status = 301
  force = true

# Same-origin API proxy — HttpOnly session cookie works in Safari (no third-party cookie).
[[redirects]]
  from = "/api/*"
  to = "https://coparentes-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Pliki statyczne w /downloads/ — bez przekierowania na SPA
[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: http://localhost:* http://127.0.0.1:* https://www.gstatic.com; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*.pptx"
  [headers.values]
    Content-Type = "application/vnd.openxmlformats-officedocument.presentationml.presentation"
    Content-Disposition = "attachment; filename=\"instrukcja-nowa-rodzina.pptx\""
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
