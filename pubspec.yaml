name: coparentes
description: coparentes - AI-first co-parenting app for Poland
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  flutter_secure_storage: ^9.2.4
  http: 1.5.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  image: ^4.5.4
  uuid: ^4.5.1
  table_calendar: ^3.2.0
  fl_chart: 0.69.0
  cupertino_icons: 1.0.8
  intl: ^0.20.2
  crypto: ^3.0.6
  path_provider: ^2.1.5
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/branding/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
